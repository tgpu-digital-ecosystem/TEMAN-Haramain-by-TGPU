</style></head><body><main><a href="/" class="back" data-auth-i18n="back">← Home</a><div class="brand"><img src="/teman-icon.svg?v=3" alt="">TEMAN Haramain</div><h1 data-auth-i18n="heading">Welcome back</h1><p data-auth-i18n="intro">Already registered? Sign in to continue learning.</p>
