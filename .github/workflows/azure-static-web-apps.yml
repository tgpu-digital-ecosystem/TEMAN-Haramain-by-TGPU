name: TEMAN CI (no deployment)
on:
  push:
    branches: [main, 'feature/teman-business-*', 'feature/teman-phase2-*']
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run test:business-db
      - run: npm run build
      - name: Install browser for synthetic UI verification
        run: npx playwright install --with-deps chromium
      - name: Verify synthetic mobile and RTL UI
        run: npm run test:phase2-browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teman-phase2-browser-evidence
          path: docs/evidence/phase2/
          if-no-files-found: ignore
          retention-days: 7
