name: TEMAN Haramain — GitHub regression CI (Cloudflare production)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: teman-swa-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_job:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Test TEMAN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm run test
      - name: Verify app build
        run: npm run build
      - name: Verify Cloudflare Worker build
        run: npm run build:worker


# Azure deployment and live-domain verification were intentionally retired from this
# workflow. Cloudflare Workers is the active production deployment system.
# Keep regression tests here; production verification belongs to Cloudflare CI.
