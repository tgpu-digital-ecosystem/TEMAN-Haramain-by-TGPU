name: TEMAN Haramain — Azure Static Web Apps

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: teman-swa-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Test TEMAN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm run test
      - name: Verify app build
        run: npm run build

      # Azure preview quota was exhausted on PR #19 (workflow 39087114332).
      # Validate the full PR layout locally without claiming an Azure preview.
      - name: Render pull-request mobile and desktop UI locally
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          python3 -m http.server 4173 --bind 127.0.0.1 --directory dist > /tmp/teman-pr-server.log 2>&1 &
          server_pid="$!"
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..15}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/ -o /tmp/teman-pr-home.html; then break; fi
            sleep 1
          done
          grep -Fq 'TEMAN Haramain' /tmp/teman-pr-home.html
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "::error::Chrome is unavailable for TEMAN local UI QA"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/teman-pr-qa"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --disable-background-networking --virtual-time-budget=7000 \
            --window-size=390,844 --user-data-dir="$RUNNER_TEMP/teman-pr-mobile-profile" \
            --dump-dom http://127.0.0.1:4173/ > "$RUNNER_TEMP/teman-pr-qa/mobile-dom.html"
          grep -Fq 'https://tgpu.my/' "$RUNNER_TEMP/teman-pr-qa/mobile-dom.html"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --user-data-dir="$RUNNER_TEMP/teman-pr-mobile-image" \
            --screenshot="$RUNNER_TEMP/teman-pr-qa/mobile.png" http://127.0.0.1:4173/
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1440,1000 --user-data-dir="$RUNNER_TEMP/teman-pr-desktop-image" \
            --screenshot="$RUNNER_TEMP/teman-pr-qa/desktop.png" http://127.0.0.1:4173/
          test -s "$RUNNER_TEMP/teman-pr-qa/mobile.png"
          test -s "$RUNNER_TEMP/teman-pr-qa/desktop.png"
          echo "PASS: PR built and rendered locally at mobile and desktop sizes without using Azure staging quota"

      - name: Upload local PR visual QA evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: teman-pr-local-visual-qa
          path: ${{ runner.temp }}/teman-pr-qa/
          retention-days: 7
          if-no-files-found: warn

  build_and_deploy_job:
    needs: test_job
    # Production deployment remains restricted to main pushes.
    # PRs use local browser QA until obsolete Azure staging slots are reclaimed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Build and Deploy TEMAN
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Prepare pinned Haramain offline map packs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/maps
          SATU_MAP_SHA="59ca2c8535b83b77e6f41ab80584e29cd5c05794"
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/tgpu-digital-ecosystem/SATU/${SATU_MAP_SHA}/public/maps/makkah.pmtiles" --output public/maps/makkah.pmtiles
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/tgpu-digital-ecosystem/SATU/${SATU_MAP_SHA}/public/maps/madinah.pmtiles" --output public/maps/madinah.pmtiles
          test -s public/maps/makkah.pmtiles
          test -s public/maps/madinah.pmtiles
          ls -lh public/maps/*.pmtiles

      - name: Build and deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          api_location: api
          output_location: dist
          app_build_command: npm run build
          api_build_command: npm run build

      - name: Verify live production domain
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://teman.tgpu.my"

          fetch_with_retry() {
            local url="$1"
            local output="$2"
            for attempt in {1..12}; do
              if curl --fail --silent --show-error --location --max-time 20 "$url" --output "$output"; then
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then sleep 5; fi
            done
            return 1
          }

          assert_contains() {
            local label="$1"
            local file="$2"
            local expected="$3"
            echo "Checking TEMAN production: $label"
            if ! grep -Fq -- "$expected" "$file"; then
              echo "::error title=TEMAN production smoke check failed::Missing expected marker: $label"
              if [ "$label" = "release marker" ]; then
                echo "Observed release marker:"
                grep -oE 'teman-v[0-9][A-Za-z0-9_-]*' "$file" | head -n 1 || true
              elif [ "$label" = "service-worker cache" ]; then
                echo "Observed service-worker cache declaration:"
                head -n 1 "$file"
              fi
              return 1
            fi
            echo "PASS: $label"
          }

          fetch_with_retry "$BASE/release.html" /tmp/teman-release.html
          assert_contains "release marker" /tmp/teman-release.html 'teman-v10-feedback-mobile-2026-10-07'

          fetch_with_retry "$BASE/" /tmp/teman-index.html
          assert_contains "homepage title" /tmp/teman-index.html '<title>TEMAN Haramain — Hajj & Umrah Safety Companion | TGPU</title>'

          fetch_with_retry "$BASE/manifest.webmanifest" /tmp/teman-manifest.json
          assert_contains "PWA manifest" /tmp/teman-manifest.json '"name": "TEMAN Haramain by TGPU"'

          fetch_with_retry "$BASE/robots.txt" /tmp/teman-robots.txt
          assert_contains "robots.txt sitemap" /tmp/teman-robots.txt 'Sitemap: https://teman.tgpu.my/sitemap.xml'

          fetch_with_retry "$BASE/sitemap.xml" /tmp/teman-sitemap.xml
          assert_contains "sitemap.xml origin" /tmp/teman-sitemap.xml '<loc>https://teman.tgpu.my/</loc>'

          fetch_with_retry "$BASE/sw.js" /tmp/teman-sw.js
          # Compare the live service-worker cache identifier against the checked-in
          # source. Release marker versions do not necessarily equal SW cache versions.
          expected_sw_cache="$(head -n 1 public/sw.js)"
          test -n "$expected_sw_cache"
          assert_contains "service-worker cache" /tmp/teman-sw.js "$expected_sw_cache"
          assert_contains "service-worker API bypass" /tmp/teman-sw.js "url.pathname.startsWith('/api/')"

          curl --silent --show-error --location --max-time 20 \
            --dump-header /tmp/teman-status-headers.txt \
            --output /tmp/teman-status-body.json \
            -H 'x-teman-viewer-token: invalid' \
            "$BASE/api/family/status?family=production-smoke-check" || true
          echo "Checking TEMAN production: family API cache policy"
          if ! grep -Eiq '^cache-control:.*no-store' /tmp/teman-status-headers.txt; then
            echo "::error title=TEMAN production smoke check failed::Family API response lacks required cache-control no-store header"
            exit 1
          fi
          echo "PASS: family API cache policy"

          CHROME="$(command -v google-chrome || command -v google-chrome-stable || true)"
          if [ -z "$CHROME" ]; then echo "::error::Headless Chrome is unavailable on this runner"; exit 1; fi
          QA_DIR="$RUNNER_TEMP/teman-live-qa"
          rm -rf "$QA_DIR"
          mkdir -p "$QA_DIR"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=390,844 --user-data-dir=/tmp/teman-chrome-mobile-shot \
            --screenshot="$QA_DIR/teman-mobile.png" "$BASE/"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=1440,1000 --user-data-dir=/tmp/teman-chrome-desktop-shot \
            --screenshot="$QA_DIR/teman-desktop.png" "$BASE/"

          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars \
            --window-size=390,844 --user-data-dir=/tmp/teman-chrome-mobile \
            --dump-dom "$BASE/" > "$QA_DIR/rendered-mobile.html"
          assert_contains "rendered mobile emergency CTA" "$QA_DIR/rendered-mobile.html" 'BANTU SAYA SEKARANG'
          assert_contains "rendered mobile bottom navigation" "$QA_DIR/rendered-mobile.html" 'teman-bottom-nav'

      - name: Upload live QA screenshots
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: teman-live-qa
          path: ${{ runner.temp }}/teman-live-qa/
          retention-days: 3
          if-no-files-found: warn

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Preview Environment
    steps:
      - name: Close pull request environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
