# Legacy filename retained to avoid disrupting existing workflow references.
# Azure deployment retired from this workflow; production is Cloudflare Workers.
name: TEMAN Haramain — GitHub CI (Cloudflare release gate)

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: teman-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_job:
    runs-on: ubuntu-latest
    name: Test TEMAN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run regression tests
        run: npm run test
      - name: Verify app build
        run: npm run build

# Cloudflare Worker tgpu-teman deployment is deliberately separate.
# Do not publish until current Worker assets/source parity, rollback and
# founder-only preview acceptance are verified.
